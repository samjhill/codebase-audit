name: Verify runner
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax
        run: bash -n run.sh
      - name: Test runner contract
        run: python3 -m unittest discover -s tests -v
