<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Code audits that show their work</title>
  <desc id="desc">A dark blue card showing one command leading to evidence, fixes, and a reviewable pull request.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#17264a"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#4de0bb"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1160" cy="80" r="260" fill="#254a75" opacity=".22"/>
  <circle cx="1060" cy="570" r="300" fill="#167d7a" opacity=".14"/>
  <text x="80" y="90" fill="#72e8c9" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="3">CODEBASE AUDIT</text>
  <text x="80" y="200" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">Code audits that</text>
  <text x="80" y="272" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="62" font-weight="700">show their work.</text>
  <rect x="80" y="327" width="1120" height="92" rx="16" fill="#0a142b" stroke="#3b5877" stroke-width="2"/>
  <text x="108" y="385" fill="#4de0bb" font-family="Menlo, Consolas, monospace" font-size="29">$</text>
  <text x="150" y="385" fill="#ecf3ff" font-family="Menlo, Consolas, monospace" font-size="24">curl -fsSL .../run.sh | bash</text>
  <text x="80" y="501" fill="#c8d7ee" font-family="Arial, Helvetica, sans-serif" font-size="29">Trace the path</text>
  <text x="332" y="501" fill="#4de0bb" font-family="Arial, Helvetica, sans-serif" font-size="29">→</text>
  <text x="383" y="501" fill="#c8d7ee" font-family="Arial, Helvetica, sans-serif" font-size="29">Verify the finding</text>
  <text x="661" y="501" fill="#4de0bb" font-family="Arial, Helvetica, sans-serif" font-size="29">→</text>
  <text x="713" y="501" fill="#c8d7ee" font-family="Arial, Helvetica, sans-serif" font-size="29">Review the fix</text>
  <rect x="80" y="554" width="1120" height="4" rx="2" fill="url(#accent)"/>
</svg>
